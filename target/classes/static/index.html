<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🎓 Student Management System</h1>
    </header>
    <div class="container">
        <div class="card">
            <h2>➕ Add New Student</h2>
            <div class="form-grid">
                <input type="text" id="name" placeholder="Full Name *">
                <input type="text" id="roll_no" placeholder="Roll Number *">
                <input type="email" id="email" placeholder="Email">
                <input type="text" id="phone" placeholder="Phone Number">
                <input type="text" id="course" placeholder="Course">
            </div>
            <button class="btn-add" onclick="addStudent()">➕ Add Student</button>
        </div>
        <div class="card">
            <div class="table-header">
                <h2>📋 All Students</h2>
                <button class="btn-refresh" onclick="loadStudents()">🔄 Refresh</button>
            </div>
            <div id="message" class="message"></div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Roll No</th>
                        <th>Email</th><th>Phone</th><th>Course</th><th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align:center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
